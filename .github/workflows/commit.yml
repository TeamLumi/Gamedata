name: Send updates to dependent repo

on:
  push:
    branches: 
      - main

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Check Python Version
      run: python3 --version

    - name: Run 2.0 Convert Python Script
      run: python3 Python_tasks/convert_lmpt_data.py 2.0

    - name: Run 2.0 Tracker Data Script
      run: python3 Python_tasks/trainerDocsUtils.py 2.0

    - name: Run 2.0 Pokedex Script
      run: python3 Python_tasks/pokedex_generator.py 2.0

    - name: Pushes Input Files
      uses: TeamLumi/Gamedata@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.DENMARK_GAMEDATA_AUTOMATION_TOKEN }}
      with:
        source_file: 'input/.'
        destination_branch: 'master'
        destination_repo: 'TeamLumi/LumiPlat_NuzlockeTracker'
        destination_folder: './src/lumi-calc/input'
        user_email: '<support+actions@github.com>'
        user_name: 'github-actions-bot'
        commit_message: 'Updating 2.0 gamedata files'

    - name: Pushes test files
      uses: TeamLumi/Gamedata@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.DENMARK_GAMEDATA_AUTOMATION_TOKEN }}
      with:
        source_file: 'Python_tasks/output/.'
        destination_branch: 'master'
        destination_repo: 'TeamLumi/LumiPlat_NuzlockeTracker'
        destination_folder: './src/constants/generated_files'
        user_email: '<support+actions@github.com>'
        user_name: 'github-actions-bot'
        commit_message: 'Updating 2.0 output files'

  update-lumibot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Run 2.0 Pokedex Script
      run: python3 Python_tasks/pokedex_generator.py 2.0

    - name: Pushes test file
      uses: TeamLumi/Gamedata@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.DENMARK_LUMIBOT_TOKEN }}
      with:
        source_file: 'input/.'
        destination_branch: 'master'
        destination_repo: 'TeamLumi/Lumibot'
        destination_folder: './__gamedata'
        user_email: '<support+actions@github.com>'
        user_name: 'github-actions-bot'
        commit_message: 'Updating 2.0 gamedata files'

    - name: Pushes 3.0 test file
      uses: TeamLumi/Gamedata@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.DENMARK_LUMIBOT_TOKEN }}
      with:
        source_file: '3.0Input/.'
        destination_branch: 'master'
        destination_repo: 'TeamLumi/Lumibot'
        destination_folder: './__3.0gamedata'
        user_email: '<support+actions@github.com>'
        user_name: 'github-actions-bot'
        commit_message: 'Updating 3.0 gamedata files'
  
  update-website-main:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Run Vanilla Pokedex Script
      run: python3 Python_tasks/pokedex_generator.py vanilla

    - name: Run Vanilla Trainer Data Script
      run: python3 Python_tasks/trainerDocsUtils.py vanilla

    - name: Run Vanilla Pokemon Location Script
      run: python3 Python_tasks/convert_lmpt_data.py vanilla

    - name: Run 2.0 Pokedex Script
      run: python3 Python_tasks/pokedex_generator.py 2.0

    - name: Run 2.0 Trainer Data Script
      run: python3 Python_tasks/trainerDocsUtils.py 2.0

    - name: Run 2.0 Pokemon Location Script
      run: python3 Python_tasks/convert_lmpt_data.py 2.0

    - name: Run 3.0 Pokedex Script
      run: python3 Python_tasks/pokedex_generator.py 3.0

    - name: Run 3.0 Pokemon Location Script
      run: python3 Python_tasks/convert_lmpt_data.py 3.0

    - name: Run TM Learnset Consolidation
      run: python3 Python_tasks/consolidate_tmlearnset.py 3.0

    - name: Run scripts for all item locations
      run: |
        python3 Python_tasks/get_hidden_items.py vanilla hidden
        python3 Python_tasks/get_hidden_items.py vanilla field
        python3 Python_tasks/get_scripted_items.py vanilla
        python3 Python_tasks/get_hidden_items.py 2.0 hidden
        python3 Python_tasks/get_hidden_items.py 2.0 field
        python3 Python_tasks/get_scripted_items.py 2.0
        python3 Python_tasks/get_hidden_items.py 3.0 hidden
        python3 Python_tasks/get_hidden_items.py 3.0 field
        python3 Python_tasks/get_scripted_items.py 3.0

    - name: Stage all gamedata files
      run: |
        # Create the exact destination directory structure
        mkdir -p staging_dir/__gamedata/gamedataVanilla
        mkdir -p staging_dir/__gamedata/gamedata2.0
        mkdir -p staging_dir/__gamedata/gamedata3.0

        # Copy Vanilla files
        cp -a vanilla_input/. staging_dir/__gamedata/gamedataVanilla/
        cp Python_tasks/outputVanilla/Mapper_Trainer_Output.json staging_dir/__gamedata/gamedataVanilla/
        cp Python_tasks/outputVanilla/field_items.json staging_dir/__gamedata/gamedataVanilla/
        cp Python_tasks/outputVanilla/hidden_items.json staging_dir/__gamedata/gamedataVanilla/
        cp Python_tasks/outputVanilla/item_map.json staging_dir/__gamedata/gamedataVanilla/

        # Copy 2.0 files
        cp -a input/. staging_dir/__gamedata/gamedata2.0/
        cp Python_tasks/output/Mapper_Trainer_Output.json staging_dir/__gamedata/gamedata2.0/
        cp Python_tasks/output/field_items.json staging_dir/__gamedata/gamedata2.0/
        cp Python_tasks/output/hidden_items.json staging_dir/__gamedata/gamedata2.0/
        cp Python_tasks/output/item_map.json staging_dir/__gamedata/gamedata2.0/

        # Copy 3.0 files
        cp -a 3.0Input/. staging_dir/__gamedata/gamedata3.0/
        cp Python_tasks/3.0Output/Mapper_Trainer_Output.json staging_dir/__gamedata/gamedata3.0/
        cp Python_tasks/3.0Output/field_items.json staging_dir/__gamedata/gamedata3.0/
        cp Python_tasks/3.0Output/hidden_items.json staging_dir/__gamedata/gamedata3.0/
        cp Python_tasks/3.0Output/item_map.json staging_dir/__gamedata/gamedata3.0/

    - name: Push all gamedata files
      uses: TeamLumi/Gamedata@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.DENMARK_LUMIBOT_TOKEN }}
      with:
        source_file: 'staging_dir/.'
        destination_branch: 'main'
        destination_repo: 'TeamLumi/luminescent-team'
        destination_folder: '.' # Pushing to the root so the inner structure maps correctly
        user_email: '<support+actions@github.com>'
        user_name: 'github-actions-bot'
        commit_message: 'Updating Vanilla, 2.0, and 3.0 gamedata and trainer files'

  update-dev-website:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Run Vanilla Pokedex Script
      run: python3 Python_tasks/pokedex_generator.py vanilla

    - name: Run Vanilla Trainer Data Script
      run: python3 Python_tasks/trainerDocsUtils.py vanilla

    - name: Run Vanilla Pokemon Location Script
      run: python3 Python_tasks/convert_lmpt_data.py vanilla

    - name: Run 2.0 Pokedex Script
      run: python3 Python_tasks/pokedex_generator.py 2.0

    - name: Run Lumi Data Scripts
      run: python3 Python_tasks/convert_lmpt_data.py 2.0
      
    - name: Run 2.0 Trainer Data Script
      run: python3 Python_tasks/trainerDocsUtils.py 2.0

    - name: Run 3.0 Pokedex Script
      run: python3 Python_tasks/pokedex_generator.py 3.0

    - name: Run 3.0 Trainer Data Script
      run: python3 Python_tasks/trainerDocsUtils.py 3.0

    - name: Run 3.0 Pokemon Location Script
      run: python3 Python_tasks/convert_lmpt_data.py 3.0

    - name: Run TM Learnset Consolidation
      run: python3 Python_tasks/consolidate_tmlearnset.py 3.0

    - name: Run scripts for all item locations
      run: |
        python3 Python_tasks/get_hidden_items.py vanilla hidden
        python3 Python_tasks/get_hidden_items.py vanilla field
        python3 Python_tasks/get_scripted_items.py vanilla
        python3 Python_tasks/get_hidden_items.py 2.0 hidden
        python3 Python_tasks/get_hidden_items.py 2.0 field
        python3 Python_tasks/get_scripted_items.py 2.0
        python3 Python_tasks/get_hidden_items.py 3.0 hidden
        python3 Python_tasks/get_hidden_items.py 3.0 field
        python3 Python_tasks/get_scripted_items.py 3.0

    - name: Stage all gamedata files
      run: |
        # Create the exact destination directory structure
        mkdir -p staging_dir/__gamedata/gamedataVanilla
        mkdir -p staging_dir/__gamedata/gamedata2.0
        mkdir -p staging_dir/__gamedata/gamedata3.0

        # Copy Vanilla files
        cp -a vanilla_input/. staging_dir/__gamedata/gamedataVanilla/
        cp Python_tasks/outputVanilla/Mapper_Trainer_Output.json staging_dir/__gamedata/gamedataVanilla/
        cp Python_tasks/outputVanilla/field_items.json staging_dir/__gamedata/gamedataVanilla/
        cp Python_tasks/outputVanilla/hidden_items.json staging_dir/__gamedata/gamedataVanilla/
        cp Python_tasks/outputVanilla/item_map.json staging_dir/__gamedata/gamedataVanilla/

        # Copy 2.0 files
        cp -a input/. staging_dir/__gamedata/gamedata2.0/
        cp Python_tasks/output/Mapper_Trainer_Output.json staging_dir/__gamedata/gamedata2.0/
        cp Python_tasks/output/field_items.json staging_dir/__gamedata/gamedata2.0/
        cp Python_tasks/output/hidden_items.json staging_dir/__gamedata/gamedata2.0/
        cp Python_tasks/output/item_map.json staging_dir/__gamedata/gamedata2.0/

        # Copy 3.0 files
        cp -a 3.0Input/. staging_dir/__gamedata/gamedata3.0/
        cp Python_tasks/3.0Output/Mapper_Trainer_Output.json staging_dir/__gamedata/gamedata3.0/
        cp Python_tasks/3.0Output/field_items.json staging_dir/__gamedata/gamedata3.0/
        cp Python_tasks/3.0Output/hidden_items.json staging_dir/__gamedata/gamedata3.0/
        cp Python_tasks/3.0Output/item_map.json staging_dir/__gamedata/gamedata3.0/

    - name: Push all gamedata files to dev
      uses: TeamLumi/Gamedata@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.DENMARK_LUMIBOT_TOKEN }}
      with:
        source_file: 'staging_dir/.'
        destination_branch: 'main'
        destination_repo: 'TeamLumi/luminescent-team-dev'
        destination_folder: '.'
        user_email: '<support+actions@github.com>'
        user_name: 'github-actions-bot'
        commit_message: 'Updating Vanilla, 2.0, and 3.0 gamedata and trainer files'
